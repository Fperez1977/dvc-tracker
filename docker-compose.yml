services:
  dvc-tracker:
    build: .
    # If you'd rather pull a pre-built image instead of building on the NAS,
    # comment out "build: ." above and use "image:" with your own registry tag.
    container_name: dvc-tracker
    restart: unless-stopped
    # Not published to the host — only the proxy below can reach it, on the
    # internal docker network, at "dvc-tracker:8501". This is what forces
    # all traffic through the password prompt.
    expose:
      - "8501"
    volumes:
      # Persists dvc_tracker.db and purchase_agreements/ on the NAS so
      # they survive container recreation and image upgrades.
      - ./data:/app/data

  proxy:
    build: ./nginx
    container_name: dvc-tracker-proxy
    restart: unless-stopped
    depends_on:
      - dvc-tracker
    ports:
      # This is the port you actually browse to: http://<nas-ip>:8501
      # Change the left-hand side if 8501 is already used on your Synology
      # (e.g. "8601:80").
      - "8501:80"
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
