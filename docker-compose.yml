services:
  dvc-tracker:
    build: .
    # If you'd rather pull a pre-built image instead of building on the NAS,
    # comment out "build: ." above and use "image:" with your own registry tag.
    container_name: dvc-tracker
    restart: unless-stopped
    ports:
      # Host port : container port. Change the left-hand side if 8501 is
      # already used on your Synology (e.g. "8601:8501").
      - "8501:8501"
    volumes:
      # Persists dvc_tracker.db and purchase_agreements/ on the NAS so
      # they survive container recreation and image upgrades.
      - ./data:/app/data
