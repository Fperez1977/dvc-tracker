server {
    listen 80;
    server_name _;

    auth_basic "DVC Tracker";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://dvc-tracker:8501;

        # Streamlit relies on a long-lived websocket connection for live
        # updates — without these, the UI loads but stays "connecting"
        # forever or disconnects repeatedly.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
